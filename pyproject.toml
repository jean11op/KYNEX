[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holocontrol-access"
version = "0.1.0"
description = "Control accesible de Windows mediante gestos de las manos"
requires-python = ">=3.11"
dependencies = [
    "PySide6",
    "opencv-contrib-python",
    "mediapipe",
    "pyautogui",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"holocontrol.infrastructure.vision" = ["models/*.task", "models/LICENSE", "models/NOTICE.md"]
"holocontrol.infrastructure.persistence" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
